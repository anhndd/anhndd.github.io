
<h1>Send and Receive multiple files using Netcat</h1>

<div>
<p>Step 1: Open listener on receiver machine</p>
<pre style="background-color: #000; color: #fff">
nc -l -p 9999 | tar xzf
</pre>
</div>	

<div>
<p>Step 2: Sending files on sender machine </p>
<pre style="background-color: #000; color: #fff">
tar czf - [Name of file or *(all)] | nc -w 5 [IP address of the receiver] 9999
</pre>
</div>
