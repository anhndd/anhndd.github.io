<h1>Quickly Enable Hostpot Using Terminal</h1>

<div>
    <p>Here is the command to run Hostpot in the terminal </p>
    <pre style="background-color: #000; color: #fff">
nmcli device wifi hotspot con-name [your-hostpot-name] ssid [your-hostpot-name] password [your-hostpot-password]
</pre>
</div>
